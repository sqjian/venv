name: "venv_devcontainer"

x-common-config: &common-config
  image: artifacts.iflytek.com/docker-private/aiaas/venv:ubuntu24.04-cuda13.0
  pull_policy: always
  restart: "no"
  privileged: true
  ulimits:
    memlock: -1
    stack: -1
    core: 0
    nproc: 65535
    nofile:
      soft: 65535
      hard: 65535
  ipc: host
  network_mode: "host"
  env_file: ./.env
  volumes:
    - /:/host:rw
    - ./../../:/workspaces
    - /var/run/docker.sock:/var/run/docker.sock:rw
    # xdg config
    - /sqjian/.saves/config:/root/.config
    # xdg cache
    - /sqjian/.saves/cache:/root/.cache
    - /sqjian/.saves/cache/uv_python:/root/.local/share/uv/python
    - /sqjian/.saves/cache/mise:/root/.local/share/mise
    # xdg data
    - /sqjian/.saves/data/codex:/root/.codex
    - /sqjian/.saves/data/claude:/root/.claude
    - /sqjian/.saves/data/krew:/root/.krew
    - /sqjian/.saves/data/ssh:/root/.ssh:rw
    - /sqjian/.saves/data/vs_ext:/root/.vscode-server/extensions
    - /sqjian/.saves/data/linuxbrew:/home/linuxbrew
    - /sqjian/.saves/data/fish:/root/.local/share/fish
    - /sqjian/.saves/data/chezmoi:/root/.local/share/chezmoi
  gpus: all

services:
  workspace:
    <<: *common-config
    hostname: venv-workspace
    entrypoint: [ "bash", "-l", "-c" ]
    command:
      - |
        sleep infinity
