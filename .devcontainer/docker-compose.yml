name: "venv_devcontainer"

x-common-config: &common-config
  image: artifacts.iflytek.com/docker-private/aiaas/venv:ubuntu24.04-cuda13.0
  pull_policy: always
  restart: "no"
  privileged: true
  ulimits:
    memlock: -1
    stack: -1
    core: 0
    nproc: 65535
    nofile:
      soft: 65535
      hard: 65535
  ipc: host
  network_mode: "host"
  environment:
    - XDG_CONFIG_HOME=/root/.config
    - XDG_CACHE_HOME=/root/.cache
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - /mnt:/mnt:rw
    - /sqjian/.ssh:/root/.ssh:rw
    - /var/run/docker.sock:/var/run/docker.sock:rw
    - xdg_cache:/root/.cache
    - uv_python:/root/.local/share/uv/python
    - vscode_extensions:/root/.vscode-server/extensions
    - linuxbrew:/home/linuxbrew
    - homebrew:/root/.config/homebrew
    - models:/mnt/models
    - datasets:/mnt/datasets
    - /mnt/ramdisk:/mnt/ramdisk:rw
    - fish:/root/.local/share/fish
    - codex:/root/.codex
    - dcg:/root/.config/dcg
    - krew:/root/.krew
    - claude:/root/.claude
    - pi:/root/.pi
    - /sqjian/.claude.json:/root/.claude.json:rw
    - ./../../:/workspaces
  gpus: all

services:
  workspace:
    <<: *common-config
    hostname: venv-workspace
    entrypoint: [ "bash", "-l", "-c" ]
    command:
      - |
        sleep infinity

volumes:
  xdg_cache: { external: true }
  uv_python: { external: true }
  vscode_extensions: { external: true }
  models: { external: true }
  datasets: { external: true }
  linuxbrew: { external: true }
  homebrew: { external: true }
  fish: { external: true }
  codex: { external: true }
  dcg: { external: true }
  krew: { external: true }
  claude: { external: true }
  pi: { external: true }
