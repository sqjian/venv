[settings]
env_shell_expand = true

[env]
_.path = [
  "{{env.HOME}}/.local/bin",
  "{{env.HOME}}/.cargo/bin",
]

# dcg
DCG_BYPASS = "1"

[shell_alias]
gs = "git status"
gc = "git commit"
gl = "git log --graph --decorate --date=iso --stat --stat-count=5"

[task_config]
includes = ["{{mise_config_dir}}/tasks"]
