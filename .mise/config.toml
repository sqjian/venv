[env]
_.path = [
  ".venv/bin",
  "{{env.HOME}}/.local/bin",
  "{{env.HOME}}/.cargo/bin",
  "{{env.HOME}}/.krew/bin",
]

# venv settings
VIRTUAL_ENV = "{{config_root}}/.venv"
UV_LINK_MODE = "copy"
UV_VENV_CLEAR = "1"
PIP_DISABLE_PIP_VERSION_CHECK = "1"

# CUDA settings
LIBRARY_PATH = "${LIBRARY_PATH:-}:/usr/local/cuda/lib64"
LD_LIBRARY_PATH = "${LD_LIBRARY_PATH:-}:/usr/local/cuda/lib64:/usr/local/lib"

# dcg
DCG_BYPASS = "1"

[task_config]
includes = [
  ".mise/tasks",
  "{{mise_config_dir}}/tasks",
]
